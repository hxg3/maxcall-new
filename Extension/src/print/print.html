<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Printing…</title>
  <style>
    body { font-family: "Segoe UI", Tahoma, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { text-align: center; }
    .spin { display: inline-block; width: 26px; height: 26px; border: 3px solid #0ea5e9;
            border-top-color: transparent; border-radius: 50%; animation: sp .7s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    #msg { margin-top: 12px; font-size: 14px; }
    button { margin-top: 14px; border: none; border-radius: 10px; padding: 10px 22px;
             font: inherit; font-weight: 700; background: #0ea5e9; color: #fff; cursor: pointer;
             display: none; }
    iframe { position: fixed; right: 0; bottom: 0; width: 2px; height: 2px; opacity: 0.01; border: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin" id="sp"></div>
    <div id="msg">Preparing the document…</div>
    <button id="btn">Print</button>
  </div>
  <script src="print.js"></script>
</body>
</html>
