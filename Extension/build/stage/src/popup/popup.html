<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <style>
    :root { --ink:#0f172a; --sub:#64748b; --line:#e2e8f0; --brand:#0ea5e9; --ok:#059669; --err:#dc2626; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 340px; font-family: "Segoe UI", Tahoma, sans-serif; font-size: 13px; color: var(--ink); background: #f8fafc; }
    header { display: flex; align-items: center; gap: 8px; padding: 11px 14px 9px; }
    .logo { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #0ea5e9, #0369a1); flex: none; }
    header h1 { font-size: 13.5px; font-weight: 700; flex: 1; }
    header .hbtn { display: flex; gap: 2px; }
    header a { color: var(--sub); font-size: 15px; text-decoration: none; padding: 3px 6px; border-radius: 7px; }
    header a:hover { color: var(--ink); background: #e2e8f0; }
    #updBar { display: none; align-items: center; gap: 8px; margin: 0 14px 8px; padding: 8px 12px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; font-size: 12px; color: #92400e; }
    #updBar.show { display: flex; }
    #updBtn { border: none; border-radius: 8px; background: #d97706; color: #fff; font: inherit; font-weight: 700; padding: 4px 12px; cursor: pointer; }
    main { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 9px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .empty { color: var(--sub); text-align: center; padding: 14px 6px; }
    .p-name { font-size: 15px; font-weight: 700; }
    .p-meta { color: var(--sub); margin-top: 2px; font-size: 12px; }
    .cardTitle { font-size: 12.5px; font-weight: 700; color: var(--sub); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: #ecfeff; color: #0e7490; font-weight: 700; font-size: 12px; }
    .chip.warn { background: #fff7ed; color: #c2410c; }
    .kv { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 0; }
    .kv b { font-weight: 600; color: var(--sub); font-size: 12px; }
    .kv span { font-family: Consolas, monospace; }
    .cardno { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
    select { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font: inherit; font-size: 12px; background: #fff; color: var(--ink); max-width: 185px; }
    button.smallBtn { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font: inherit; font-weight: 700; font-size: 11.5px; color: var(--ink); background: #fff; cursor: pointer; white-space: nowrap; }
    button.smallBtn:hover { border-color: var(--brand); color: var(--brand); }
    button.smallBtn:disabled { opacity: .5; cursor: default; }
    button.link { border: none; background: none; color: var(--sub); font: inherit; font-size: 11px; cursor: pointer; text-decoration: underline; }
    button.link:hover { color: var(--err); }
    button.cta { border: none; border-radius: 11px; padding: 11px; width: 100%; font: inherit; font-weight: 700; font-size: 13.5px; color: #fff; background: var(--brand); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    button.cta:hover { background: #0284c7; }
    button.cta:disabled { opacity: .45; cursor: default; }
    .manual { display: none; gap: 6px; }
    .manual input { flex: 1; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font: inherit; }
    .manual button { border: none; border-radius: 9px; background: #1e293b; color: #fff; font: inherit; font-weight: 700; padding: 8px 14px; cursor: pointer; }
    #attachList { display: flex; flex-wrap: wrap; gap: 7px; max-height: 148px; overflow-y: auto; border: 1px solid var(--line); border-radius: 9px; padding: 7px; background: #fafbfc; min-height: 34px; margin-top: 7px; }
    #attachStatus { font-size: 11px; color: var(--sub); margin-top: 5px; min-height: 14px; }
    #excelInputs input { width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 8px; font: inherit; }
    .spin-white { display: inline-block; width: 12px; height: 12px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: sp .7s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    #status { font-size: 12px; color: var(--sub); text-align: center; min-height: 16px; }
    #status.err { color: var(--err); font-weight: 600; }
    footer { display: flex; justify-content: space-between; padding: 0 14px 10px; font-size: 11px; color: var(--sub); }
    #preview { display: none; position: fixed; inset: 0; z-index: 50; background: #0f172af2; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 14px; cursor: zoom-out; }
    #previewImg { max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 8px; background: #fff; }
    #previewCap { color: #cbd5e1; font-size: 11.5px; text-align: center; word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <h1>MaxCare</h1>
    <div class="hbtn">
      <a href="#" id="refreshBtn" title="Refresh">&#8635;</a>
      <a href="#" id="openOptions" title="Settings">&#9881;</a>
    </div>
  </header>
  <div id="updBar">
    <span id="updText"></span>
    <button id="updBtn">Update</button>
  </div>
  <main>
    <div class="card" id="patientCard">
      <div class="empty" id="patientEmpty">Reading the patient&hellip;</div>
      <div id="patientBody" style="display:none">
        <div class="p-name" id="pName"></div>
        <div class="p-meta" id="pMeta"></div>
      </div>
    </div>

    <div class="card" id="insCard" style="display:none">
      <div class="cardTitle"><span class="chip" id="insChip"></span></div>
      <div style="margin-top:7px">
        <div class="kv"><b>Card</b><span class="cardno" id="iCard"></span></div>
        <div class="kv" id="typeRow" style="display:none"><b>Type</b>
          <select id="typeSel"></select>
        </div>
      </div>
    </div>

    <div class="card" id="excelFields" style="display:none">
      <div class="cardTitle">Required fields</div>
      <div id="excelInputs" style="margin-top:7px"></div>
    </div>

    <div class="card" id="attachCard">
      <div class="cardTitle">
        <span>Attachments</span>
        <button type="button" id="clearAttach" class="link" style="display:none">Clear</button>
      </div>
      <div style="display:flex; gap:6px; margin-top:7px; justify-content:flex-end">
        <button type="button" id="attachFromWa" class="smallBtn">Wa</button>
      </div>
      <div id="attachList"><div id="attachEmpty">Loading documents&hellip;</div></div>
      <div id="attachStatus"></div>
    </div>

    <button class="cta" id="printBtn" disabled>Print</button>

    <div class="manual" id="manual">
      <input id="manualId" placeholder="Patient file no." inputmode="numeric" />
      <button id="manualGo">Go</button>
    </div>

    <div id="status"></div>
  </main>
  <footer>
    <a href="#" id="probeLink">Rc</a>
    <a href="#" id="copyLog">Log</a>
  </footer>
  <div id="preview" tabindex="-1">
    <img id="previewImg" alt="attachment preview" />
    <div id="previewCap"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
