<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <title>MaxCare Settings</title>
  <style>
    :root { --ink:#0f172a; --sub:#64748b; --line:#e2e8f0; --brand:#0ea5e9; --ok:#059669; --err:#dc2626; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 13.5px; color: var(--ink); background: #f8fafc; padding: 26px 0 44px; }
    .wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 13px; }
    h1 { font-size: 17px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; display: flex; flex-direction: column; gap: 10px; }
    .card > h2 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .card > h2 .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .dot.nextcare { background: #f59e0b; }
    .dot.mednet { background: #8b5cf6; }
    .dot.liva { background: #059669; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--sub); }
    input[type=text], input[type=password] { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font: inherit; }
    input:focus { outline: 2px solid #bae6fd; border-color: var(--brand); }
    .actions { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
    button { border: none; border-radius: 10px; padding: 9px 22px; font: inherit; font-weight: 700; cursor: pointer; }
    .save { background: var(--brand); color: #fff; }
    .save:hover { background: #0284c7; }
    .save:disabled { opacity: .5; cursor: default; }
    #out { font-size: 12.5px; min-height: 17px; color: var(--sub); }
    #out.ok { color: var(--ok); font-weight: 700; }
    #out.err { color: var(--err); font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Insurance logins</h1>

    <div class="card">
      <h2><span class="dot nextcare"></span>NextCare</h2>
      <div class="row2">
        <label>User
          <input type="text" id="nextcareUser" autocomplete="off" />
        </label>
        <label>Password
          <input type="password" id="nextcarePass" autocomplete="new-password" />
        </label>
      </div>
    </div>

    <div class="card">
      <h2><span class="dot mednet"></span>MedNet</h2>
      <div class="row2">
        <label>User
          <input type="text" id="mednetUser" autocomplete="off" />
        </label>
        <label>Password
          <input type="password" id="mednetPass" autocomplete="new-password" />
        </label>
      </div>
    </div>

    <div class="card">
      <h2><span class="dot liva"></span>Liva</h2>
      <div class="row2">
        <label>User
          <input type="text" id="livaUser" autocomplete="off" />
        </label>
        <label>Password
          <input type="password" id="livaPass" autocomplete="new-password" />
        </label>
      </div>
    </div>

    <div class="actions">
      <button class="save" id="save">Save</button>
      <span id="out"></span>
    </div>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
