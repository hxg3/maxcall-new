name: Probe cng
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          "=== 64-bit ==="
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ".github\workflows\cng-probe.ps1"
          "=== 32-bit ==="
          & "$env:SystemRoot\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ".github\workflows\cng-probe.ps1"
