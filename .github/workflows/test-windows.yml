name: Windows Update Test
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to test"
        type: choice
        required: true
        default: "beta"
        options:
          - beta
          - stable

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      MAXCALL_DIR: "C:\\maxcall"
      MIRROR_BASE: "http://maxcall.local:3001/updates"
    steps:
      - uses: actions/checkout@v4

      - name: Test the real update path
        shell: powershell
        run: |
          powershell.exe -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\workflows\test-update.ps1" -Channel "${{ github.event.inputs.channel }}" -Action full
        continue-on-error: true

      - name: Result
        shell: powershell
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\test-result.json") {
            $r = Get-Content "$env:GITHUB_WORKSPACE\test-result.json" -Raw | ConvertFrom-Json
            "### Result: $($r.success)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "channel: $($r.channel) | mirror-first: $($r.steps.updateCheck.fromMirror) | 12152: $($r.steps.updateCheck.tlsError)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            if ($r.error) { "error: $($r.error)" | Out-File -Append $env:GITHUB_STEP_SUMMARY }
            $r.steps.PSObject.Properties | ForEach-Object { "  $($_.Name): $($_.Value | ConvertTo-Json -Depth 4 -Compress)" }
          } else { "no result file" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-test-${{ github.event.inputs.channel }}
          path: test-result.json
          if-no-files-found: warn
          retention-days: 14