name: ATL Base64 Probe

on:
  workflow_dispatch:
  push:
    branches: [ atl-probe ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Compile probe
        shell: pwsh
        run: |
          $code = @'
#include <cstdio>
#include <cstring>
#include <cstdlib>
#include <windows.h>
#include <atlenc.h>

static int fails = 0;

int main() {
    const char* src = "103:Abdullah@x";
    int srcLen = (int)strlen(src);

    // 1) the exact pattern the shipped popup code used
    int probeLen = 0;
    int probe = Base64Encode((const BYTE*)src, srcLen, NULL, &probeLen, ATL_BASE64_FLAG_NONE);
    printf("1) probe with NULL dest: ret=%d destLen=%d -> %s\n",
           probe, probeLen, (probe != 0) ? "SUPPORTED" : "REJECTED (expected ATL contract, bug confirmed)");
    fflush(stdout);
    if (probe == 0) { printf("::notice::NULL-probe rejected as diagnosed\n"); }

    // 2) the fixed pattern: pre-sized buffer
    char* buf = (char*)malloc(((srcLen + 2) / 3) * 4 + 1);
    int chain = (int)(((srcLen + 2) / 3) * 4 + 1);
    int ret = Base64Encode((const BYTE*)src, srcLen, buf, &chain, ATL_BASE64_FLAG_NONE);
    printf("2) pre-sized: ret=%d out=[%.*s] outLen=%d\n", ret, chain, buf, chain);
    fflush(stdout);

    // 3) must equal the standard reference
    const char* ref = "MTAzOkFiZHVsbGFoQHg=";
    if (ret <= 0 || strncmp(buf, ref, strlen(ref) + 1) != 0) {
        printf("::error::fixed pattern produced [%s], expected [%s]\n", ret > 0 ? buf : "<empty>", ref);
        fails = 1;
    } else {
        printf("3) reference match OK — fixed pattern produces a valid Basic header value\n");
    }
    free(buf);
    return fails;
}
'@
          Set-Content -Path "$env:GITHUB_WORKSPACE/probe.cpp" -Value $code -Encoding ascii

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run probe
        shell: pwsh
        run: |
          cl /nologo /EHsc /MD probe.cpp /Fe:probe.exe
          .\probe.exe
