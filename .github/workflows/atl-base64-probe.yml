name: ATL Base64 Probe

on:
  workflow_dispatch:
  push:
    branches: [ atl-probe ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and run the probe
        shell: pwsh
        run: |
          cl /nologo /EHsc /MD tools\atl_probe.cpp /Fe:probe.exe
          .\probe.exe
