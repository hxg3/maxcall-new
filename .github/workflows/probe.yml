name: Probe exports
on: workflow_dispatch
jobs:
  p:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          "=== search both modules ==="
          foreach ($dll in @("advapi32.dll","crypt32.dll")) {
            $p = Join-Path $env:SystemRoot "System32\$dll"
            $bytes = [System.IO.File]::ReadAllBytes($p)
            $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
            $hits = [regex]::Matches($ascii,'Crypt(ImportKey|VerifySignature|AcquireContext|DestroyKey|ReleaseContext)[AW]?') | ForEach-Object { $_.Value } | Sort-Object -Unique
            "$dll -> $($hits -join ', ')"
          }
