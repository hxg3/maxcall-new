name: Probe net
on: workflow_dispatch
jobs:
  p:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - shell: powershell
        run: |
          "by IPv4 literal:"; try { (Invoke-WebRequest http://192.168.1.32:3001/updates/update.json -UseBasicParsing -TimeoutSec 10).StatusCode } catch { "failed: $_" }
          "by hostname:";    try { (Invoke-WebRequest http://maxcall.local:3001/updates/update.json -UseBasicParsing -TimeoutSec 10).StatusCode } catch { "failed: $_" }
          "hostname v4 only:"; try { [System.Net.Dns]::GetHostAddresses('maxcall.local') | ForEach-Object { $_.ToString() } } catch { "dns failed: $_" }
