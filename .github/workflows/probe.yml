name: Probe verify
on: workflow_dispatch
jobs:
  p:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $h = Get-Content "UpdatePublicKey.h" -Raw
          $body = $h.Substring($h.IndexOf('g_maxcallUpdatePublicKey[] = {'))
          $body = $body.Substring(0, $body.IndexOf('};'))
          $bytes = [byte[]]([regex]::Matches($body,'0x([0-9A-Fa-f]{2})') | ForEach-Object { [Convert]::ToByte($_.Groups[1].Value,16) })
          "blob bytes: $($bytes.Length)"
          $cbExp = [BitConverter]::ToUInt32($bytes,8); $cbMod = [BitConverter]::ToUInt32($bytes,12)
          "cbExp=$cbExp cbMod=$cbMod"
          $expOff = 24
          $expLE = $bytes[$expOff..($expOff+$cbExp-1)]
          $modLE = $bytes[($expOff+$cbExp)..($expOff+$cbExp+$cbMod-1)]
          [Array]::Reverse($expLE); [Array]::Reverse($modLE)
          $expTrim = [byte[]]($expLE | Where-Object { $_ -ne 0 })
          $modTrim = [byte[]]($modLE | Where-Object { $true })
          $modNoLead = [System.Collections.Generic.List[byte]]::new()
          $started = $false
          foreach ($b in $modLE) { if (-not $started) { if ($b -ne 0) { $started = $true; $modNoLead.Add($b) } } else { $modNoLead.Add($b) } }
          $modTrim = $modNoLead.ToArray()

          # Raw bytes, no string round trip: re-encoding a decoded string can
          # change a single byte and make a good signature look bad.
          $wc = New-Object System.Net.WebClient
          $msgs = $wc.DownloadData("http://192.168.1.32:3001/updates/update.json.beta")
          $sigBytes = $wc.DownloadData("http://192.168.1.32:3001/updates/update.json.beta.sig")
          $sig = [Convert]::FromBase64String([System.Text.Encoding]::ASCII.GetString($sigBytes).Trim())
          "sha256 of the bytes fetched: $([BitConverter]::ToString([System.Security.Cryptography.SHA256]::Create().ComputeHash($msgs)).Replace('-','').ToLower().Substring(0,8))"
          "signature bytes            : $($sig.Length)"
          "manifest bytes from server: $($msgs.Length)"
          $sig = [Convert]::FromBase64String($sigTxt.Trim())
          $rsa = [System.Security.Cryptography.RSA]::Create()
          $expBE = [byte[]]($expTrim[($expTrim.Length-1)..0])
          $params = New-Object System.Security.Cryptography.RSAParameters
          $params.Modulus = $modTrim
          $params.Exponent = $expBE
          $rsa.ImportParameters($params)
          "key loaded by .NET: $($rsa.KeySize) bits"
          $ok = $rsa.VerifyData($msgs, $sig, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
          ".NET VerifyData: $ok"
