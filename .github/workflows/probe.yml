name: Probe
on: workflow_dispatch
jobs:
  p:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - shell: powershell
        run: |
          Get-ChildItem C:\maxcall -Filter *.exe | ForEach-Object { "{0}  {1} bytes" -f $_.Name, $_.Length }
          "--- ini ---"
          Get-ChildItem C:\maxcall -Filter *.ini | ForEach-Object { $_.Name }
