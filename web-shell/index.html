            <p class="text-sm font-bold leading-tight">MaxCall</p>
            <p id="accountLine" class="truncate text-[11px] text-white/80" dir="ltr">not signed in</p>
          </div>
        </div>
        <div class="flex shrink-0 items-center gap-1">
          <button id="btnPin" title="Always on top" aria-label="Always on top" class="rounded-full p-1.5 text-white/70 hover:bg-white/15 active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M12 17v5M9 3h6l1 7 3 3H5l3-3 1-7Z"/></svg>
          </button>
          <button id="btnMinimize" title="Minimize" aria-label="Minimize" class="rounded-full p-1.5 hover:bg-white/15 active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M5 12h14"/></svg>
          </button>
          <button id="btnQuit" title="Quit" aria-label="Quit" class="rounded-full p-1.5 hover:bg-white/15 active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Incoming snooze strip -->
    <button id="incomingSnooze" class="hidden w-full items-center justify-between gap-2 border-b border-amber-200 bg-amber-100/70 px-3 py-1.5 text-left active:bg-amber-100">
      <span class="flex min-w-0 items-center gap-2">
        <span class="flex h-6 w-6 shrink-0 animate-pulse items-center justify-center rounded-full bg-brand text-white">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-3 w-3"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>
        </span>
        <span id="incomingSnoozeText" class="truncate text-xs font-semibold text-amber-900" dir="ltr">Incoming call — tap to answer</span>
      </span>
      <span class="shrink-0 text-[11px] font-bold text-amber-800">Answer</span>
    </button>

    <!-- 6. Engine banner -->
    <div id="engineBanner" class="flex items-center justify-between gap-2 border-b border-slate-100 bg-sky-50 px-3 py-2">
      <p class="text-xs font-medium text-sky-800">Connecting to engine…</p>
      <button id="btnRetry" title="Retry" aria-label="Retry" class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-sky-600 text-white active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-3.5 w-3.5"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
      </button>
    </div>

    <!-- Incoming call banner -->
    <div id="incomingBanner" class="hidden items-center justify-between gap-2 border-b border-slate-100 bg-amber-50 px-3 py-2">
      <div class="flex min-w-0 items-center gap-2">
        <span class="flex h-8 w-8 shrink-0 animate-pulse items-center justify-center rounded-full bg-brand text-white">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>
        </span>
        <div class="min-w-0">
          <p class="text-xs font-bold">Incoming call</p>
          <p class="truncate text-[11px] text-slate-500" dir="ltr"><span id="incomingName"></span> <span id="incomingNumber"></span></p>
        </div>
      </div>
      <div class="flex shrink-0 gap-1.5">
        <button id="btnIncomingAnswer" title="Answer" aria-label="Answer" class="flex h-8 w-8 items-center justify-center rounded-full bg-emerald-500 text-white active:scale-95">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>
        </button>
        <button id="btnIncomingReject" title="Decline" aria-label="Decline" class="flex h-8 w-8 items-center justify-center rounded-full bg-rose-500 text-white active:scale-95">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M10.7 13.3a16 16 0 0 1-2.7-2.7l1.3-1.3a2 2 0 0 0 .5-2.1c-.3-.9-.6-1.9-.7-2.9a2 2 0 0 0-2-1.7H4.1a2 2 0 0 0-2 2.1c.1 1.4.5 2.8 1 4.1m6.6 9.6c1.3.5 2.7.9 4.1 1a2 2 0 0 0 2.1-2v-2.9a2 2 0 0 0-1.7-2c-1-.1-2-.4-2.9-.7a2 2 0 0 0-2.1.5l-.5.5"/><path d="m2 2 20 20"/></svg>
        </button>
      </div>
    </div>

    <!-- Outgoing call banner -->
    <div id="outgoingBanner" class="hidden items-center justify-between gap-2 border-b border-slate-100 bg-sky-50 px-3 py-2">
      <div class="flex min-w-0 items-center gap-2">
        <span class="flex h-8 w-8 shrink-0 animate-pulse items-center justify-center rounded-full bg-brand text-white">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>
        </span>
        <div class="min-w-0">
          <p class="text-xs font-bold">Calling…</p>
          <p class="truncate text-[11px] text-slate-500" dir="ltr"><span id="outgoingName"></span> <span id="outgoingNumber"></span></p>
        </div>
      </div>
      <button id="btnOutgoingCancel" title="Cancel" aria-label="Cancel call" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-rose-500 text-white active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M10.7 13.3a16 16 0 0 1-2.7-2.7l1.3-1.3a2 2 0 0 0 .5-2.1c-.3-.9-.6-1.9-.7-2.9a2 2 0 0 0-2-1.7H4.1a2 2 0 0 0-2 2.1c.1 1.4.5 2.8 1 4.1m6.6 9.6c1.3.5 2.7.9 4.1 1a2 2 0 0 0 2.1-2v-2.9a2 2 0 0 0-1.7-2c-1-.1-2-.4-2.9-.7a2 2 0 0 0-2.1.5l-.5.5"/><path d="m2 2 20 20"/></svg>
      </button>
    </div>

    <!-- 2. Tabs -->
    <nav class="flex gap-1 border-b border-slate-100 bg-white px-3 py-2" role="tablist" aria-label="Sections">
      <button id="tabBtnDial" role="tab" aria-controls="tabDial" data-tab="tabDial" class="tab-btn flex flex-1 items-center justify-center gap-1 rounded-full bg-brand px-2 py-1.5 text-xs font-bold text-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-3.5 w-3.5"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg><span>Dial</span></button>
      <button id="tabBtnContacts" role="tab" aria-controls="tabContacts" data-tab="tabContacts" class="tab-btn flex flex-1 items-center justify-center gap-1 rounded-full px-2 py-1.5 text-xs font-medium text-slate-400 hover:text-slate-600"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-3.5 w-3.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg><span>Contacts</span></button>
      <button id="tabBtnLog" role="tab" aria-controls="tabLog" data-tab="tabLog" class="tab-btn flex flex-1 items-center justify-center gap-1 rounded-full px-2 py-1.5 text-xs font-medium text-slate-400 hover:text-slate-600"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-3.5 w-3.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Log</span></button>
    </nav>

    <main class="flex-1 px-3 py-2">
      <!-- 3. Dial -->
      <section id="tabDial" role="tabpanel" class="space-y-2">
        <!-- Active call bar directly under tabs -->
        <div id="activeCallBar" class="hidden rounded-2xl border border-teal-100 bg-teal-50/60 p-3">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <p id="acName" class="truncate text-xs font-bold">—</p>
              <p id="acNumber" class="text-[11px] text-slate-500" dir="ltr">—</p>
            </div>
            <div class="flex shrink-0 items-center gap-1.5">
              <span id="acState" class="rounded-full bg-white px-2 py-0.5 text-[11px] font-bold text-teal-800">idle</span>
              <span id="acTimer" class="font-mono text-[11px] text-slate-500" dir="ltr">0:00</span>
            </div>
          </div>
          <div class="mt-2 flex items-center justify-center gap-2">
            <button id="btnHold" title="Hold" aria-label="Hold" class="flex h-8 w-8 items-center justify-center rounded-full bg-white text-slate-600 ring-1 ring-slate-200 active:scale-95">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M9 5v14M15 5v14"/></svg>
            </button>
            <button id="btnHangup" title="Hangup" aria-label="Hangup" class="flex h-8 w-8 items-center justify-center rounded-full bg-rose-500 text-white active:scale-95">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M10.7 13.3a16 16 0 0 1-2.7-2.7l1.3-1.3a2 2 0 0 0 .5-2.1c-.3-.9-.6-1.9-.7-2.9a2 2 0 0 0-2-1.7H4.1a2 2 0 0 0-2 2.1c.1 1.4.5 2.8 1 4.1m6.6 9.6c1.3.5 2.7.9 4.1 1a2 2 0 0 0 2.1-2v-2.9a2 2 0 0 0-1.7-2c-1-.1-2-.4-2.9-.7a2 2 0 0 0-2.1.5l-.5.5"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
          <div class="mt-1.5 flex gap-1.5">
            <input id="transferTarget" dir="ltr" inputmode="tel" placeholder="Transfer to…" class="w-full rounded-xl bg-white px-2.5 py-1.5 text-xs outline-none ring-1 ring-slate-200 placeholder:text-slate-400 focus:ring-teal-500" />
            <button id="btnTransfer" title="Transfer" aria-label="Transfer" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-slate-800 text-white active:scale-95">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>
            </button>
          </div>
        </div>

        <div class="rounded-2xl border border-slate-100 bg-slate-50 p-3">
          <div class="flex items-center gap-1.5">
            <input id="dialInput" dir="ltr" inputmode="tel" autocomplete="off" placeholder="Enter number"
              class="w-full bg-transparent text-center text-xl font-bold tracking-widest text-slate-800 outline-none placeholder:text-slate-300" />
            <button id="btnBackspace" title="Delete" aria-label="Delete digit" class="shrink-0 rounded-full p-1.5 text-slate-400 hover:bg-slate-200 active:scale-95">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M21 5H8l-5 7 5 7h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Z"/><path d="m12 9 6 6M18 9l-6 6"/></svg>
            </button>
          </div>
        </div>

        <div id="dialPad" class="grid grid-cols-3 gap-1">
          <button data-digit="1" class="rounded-lg bg-slate-50 py-1.5 text-base font-bold hover:bg-teal-50 hover:text-teal-800 active:scale-95">1</button>
          <button data-digit="2" class="rounded-lg bg-slate-50 py-1.5 text-base font-bold hover:bg-teal-50 hover:text-teal-800 active:scale-95">2</button>
          <button data-digit="3" class="rounded-lg bg-slate-50 py-1.5 text-base font-bold hover:bg-teal-50 hover:text-teal-800 active:scale-95">3</button>
          <button data-digit="4" class="rounded-lg bg-slate-50 py-1.5 text-base font-bold hover:bg-teal-50 hover:text-teal-800 active:scale-95">4</button>
          <button data-digit="5" class="rounded-lg bg-slate-50 py-1.5 text-base font-bold hover:bg-teal-50 hover:text-teal-800 active:scale-95">5</button>
          <button data-digit="6" class="rounded-lg bg-slate-50 py-1.5 text-base font-bold hover:bg-teal-50 hover:text-teal-800 active:scale-95">6</button>
          <button data-digit="7" class="rounded-lg bg-slate-50 py-1.5 text-base font-bold hover:bg-teal-50 hover:text-teal-800 active:scale-95">7</button>
          <button data-digit="8" class="rounded-lg bg-slate-50 py-1.5 text-base font-bold hover:bg-teal-50 hover:text-teal-800 active:scale-95">8</button>
          <button data-digit="9" class="rounded-lg bg-slate-50 py-1.5 text-base font-bold hover:bg-teal-50 hover:text-teal-800 active:scale-95">9</button>
          <button data-digit="*" class="rounded-lg bg-slate-50 py-1.5 text-base font-bold text-slate-400 hover:bg-teal-50 hover:text-teal-800 active:scale-95">*</button>
          <button data-digit="0" class="rounded-lg bg-slate-50 py-1.5 text-base font-bold hover:bg-teal-50 hover:text-teal-800 active:scale-95">0</button>
          <button data-digit="#" class="rounded-lg bg-slate-50 py-1.5 text-base font-bold text-slate-400 hover:bg-teal-50 hover:text-teal-800 active:scale-95">#</button>
        </div>

        <div class="flex items-center justify-center gap-2">
          <button id="btnCall" title="Call" aria-label="Call" class="flex h-11 w-11 items-center justify-center rounded-full bg-emerald-500 text-white shadow-lg shadow-emerald-900/20 transition hover:bg-emerald-600 active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>
          </button>
          <button id="btnPopup" title="Open caller details" aria-label="Open caller details" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-slate-800 text-white active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
          </button>
        </div>
      </section>

      <!-- 4. Contacts -->
      <section id="tabContacts" role="tabpanel" class="hidden space-y-2">
        <div class="flex items-center gap-2 rounded-2xl bg-slate-50 px-3 py-2">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4 shrink-0 text-slate-400"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="contactSearch" placeholder="Search contacts…" class="w-full bg-transparent text-xs outline-none placeholder:text-slate-400" />
          <span id="contactCount" class="shrink-0 text-[11px] text-slate-400">0</span>
        </div>
        <div id="contactList" class="h-[248px] max-h-[248px] divide-y divide-slate-100 overflow-y-auto rounded-2xl border border-slate-100"></div>
        <p id="contactEmpty" class="rounded-2xl border border-dashed border-slate-200 px-3 py-6 text-center text-xs text-slate-400">No contacts yet.</p>
      </section>

      <!-- 5. Log -->
      <section id="tabLog" role="tabpanel" class="hidden space-y-2">
        <div class="flex items-center">
          <p class="text-xs font-bold text-slate-500">Call history</p>
        </div>
        <div class="flex items-center gap-2 rounded-2xl bg-slate-50 px-3 py-2">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4 shrink-0 text-slate-400"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="logSearch" placeholder="Search log…" class="w-full bg-transparent text-xs outline-none placeholder:text-slate-400" />
        </div>
        <div id="logList" class="h-[248px] max-h-[248px] space-y-1.5 overflow-y-auto"></div>
        <p id="logEmpty" class="rounded-2xl border border-dashed border-slate-200 px-3 py-6 text-center text-xs text-slate-400">No calls logged yet.</p>
      </section>
    </main>

    <div id="msgToast" class="fixed bottom-3 left-1/2 hidden w-[296px] -translate-x-1/2 rounded-xl bg-slate-900 px-3 py-2 shadow-xl">
      <p id="msgText" class="text-xs text-white"></p>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
