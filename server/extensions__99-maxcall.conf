; MaxCall - inbound via Queue (ringall, 25s cycles, callers wait while no one answers)
[maxcall-in]
exten => s,1,NoOp(INBOUND MaxCall Queue)
 same => n,Set(CHANNEL(language)=en)
 same => n,Set(__INBOUND_LANGUAGE=en)
 same => n,Gosub(sub-set-call-vars,s-incoming,1(${CALLERID(num)},${EXTEN},4f26a663056e45b5))
 same => n,Set(ICALL=yes)
 same => n,Answer()
 same => n,System(curl -s -X POST http://127.0.0.1:3001/api/ring/snapshot -H 'Content-Type: application/json' -d '{"linkedid":"${UNIQUEID}"}' &)
 same => n,Progress()
 same => n,Playback(custom/WelcomeMaxcall3cx)
 same => n,Gosub(sub-setup-callrec-name,s,1)
 same => n,MixMonitor(${REC_FILENAME},b)
 same => n,Set(CDR(recfile)=${REC_FILENAME})
 same => n,Set(__QUEUE_CALL=TRUE)
 same => n,Queue(maxcall-q,tT)
 same => n,Hangup()

[cos-all](+)
exten => 777,1,NoOp(Test 777)
 same => n,Set(CALLERID(all)="Test External" <77181992>)
 same => n,Goto(maxcall-in,s,1)
exten => 778,1,NoOp(Test 778)
 same => n,Set(CALLERID(all)="مختار" <93744242>)
 same => n,Goto(maxcall-in,s,1)
 same => n,Hangup()
