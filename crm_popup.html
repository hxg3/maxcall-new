<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caller Info</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{teal:"#087B78","teal-dark":"#075B59","teal-light":"#0A9D98",gold:"#D6A62A","gold-soft":"#F4E7BF",surface:"#F8FAFA",white:"#FFFFFF","teal-soft":"#DDF2F0",ink:"#1F2929","ink-sec":"#3D4B4B",muted:"#718080",border:"#E7ECEC",success:"#218A67",error:"#C94A4A",warning:"#D49A24"}}}}
</script>
<style>
*{font-family:'Segoe UI',system-ui,sans-serif}
body{background:#F8FAFA;margin:0;padding:0}
input:focus,textarea:focus{outline:none;box-shadow:0 0 0 2px rgba(8,123,120,0.15);border-color:#087B78}
#toast{transition:opacity 0.3s ease}
</style>
</head>
<body>

<!-- Caller Card -->
<div class="px-4 py-3 bg-white border-b border-border">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-teal to-teal-dark text-white flex items-center justify-center text-sm font-bold" id="avatar">?</div>
    <div class="flex-1 min-w-0">
      <div class="text-sm font-semibold text-ink truncate" id="callerName">Loading...</div>
      <div class="text-xs text-muted font-mono mt-0.5" id="callerNumber">-</div>
    </div>
    <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold" id="statusBadge">-</span>
  </div>
</div>

<!-- Patient File (WebHIS) — always-visible compact strip, details collapsed by default -->
<div id="hisSection" class="hidden px-4 pt-2">
  <button id="hisToggle" type="button" onclick="toggleHis()"
    class="w-full flex items-center gap-2 px-3 py-2 rounded-lg bg-white border border-border transition">
    <span class="text-[11px] font-semibold text-ink-sec uppercase tracking-wide">Patient file</span>
    <span id="hisBadge" class="hidden px-2 py-0.5 rounded-full text-[10px] font-semibold bg-teal-soft text-teal"></span>
    <span id="hisSummary" class="flex-1 min-w-0 text-right text-xs text-ink truncate"></span>
    <span id="hisChevron" class="text-muted text-xs shrink-0">&#9662;</span>
  </button>
  <div id="hisBody"
    class="hidden mt-1.5 rounded-lg bg-white border border-border px-3 py-2.5 max-h-[200px] overflow-y-auto flex flex-col gap-2 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"></div>
</div>

<!-- Name Input -->
<div class="px-4 pt-3 pb-2">
  <label class="text-[11px] font-semibold text-ink-sec uppercase tracking-wide block mb-1.5">Name</label>
  <input type="text" id="callerNameInput" placeholder="Enter caller name"
    class="w-full px-3 py-2 border border-border rounded-lg text-sm text-ink bg-white transition">
</div>

<!-- File no + Alt phone -->
<div class="px-4 pb-2 flex gap-2">
  <div class="flex-1 min-w-0">
    <label class="text-[11px] font-semibold text-ink-sec uppercase tracking-wide block mb-1.5">File no.</label>
    <input type="text" id="callerFileNoInput" placeholder="Patient file no."
      class="w-full px-3 py-2 border border-border rounded-lg text-sm text-ink bg-white transition">
  </div>
  <div class="flex-1 min-w-0">
    <label class="text-[11px] font-semibold text-ink-sec uppercase tracking-wide block mb-1.5">Alt phone</label>
    <input type="text" id="callerPhone2Input" placeholder="Alternate number"
      class="w-full px-3 py-2 border border-border rounded-lg text-sm text-ink bg-white transition">
  </div>
</div>

<!-- Relation -->
<div class="px-4 pb-2">
  <label class="text-[11px] font-semibold text-ink-sec uppercase tracking-wide block mb-1.5">Caller is</label>
  <select id="callerRelationInput"
    class="w-full px-3 py-2 border border-border rounded-lg text-sm text-ink bg-white transition">
    <option value="patient">Patient himself/herself</option>
    <option value="relative">Relative</option>
    <option value="other">Other</option>
  </select>
</div>

<!-- Notes -->
<div class="px-4 pb-3">
  <label class="text-[11px] font-semibold text-ink-sec uppercase tracking-wide block mb-1.5">Notes</label>
  <textarea id="notesInput" rows="3" placeholder="Notes about this caller..."
    class="w-full px-3 py-2 border border-border rounded-lg text-sm text-ink bg-white resize-none transition"></textarea>
</div>

<!-- Toast feedback -->
<div id="toast" class="hidden mx-4 mb-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-center"></div>

<!-- Buttons -->
<div class="px-4 pb-3 flex gap-2">
  <button id="dismissBtn" onclick="dismiss()"
    class="flex-1 bg-white border border-border hover:bg-surface text-ink-sec font-semibold py-2 rounded-lg transition text-sm">
    Dismiss
  </button>
  <button id="saveBtn" onclick="save()"
    class="flex-1 bg-teal hover:bg-teal-dark text-white font-semibold py-2 rounded-lg transition text-sm">
    Save
  </button>
</div>

<!-- Call history -->
<div class="px-4 pb-4">
  <div class="text-[11px] font-semibold text-ink-sec uppercase tracking-wide mb-1.5">Call history</div>
  <div id="callerHistory" class="max-h-[140px] overflow-y-auto flex flex-col gap-1.5 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"></div>
  <div id="historyEmpty" class="text-xs text-muted text-center py-2">No previous calls.</div>
</div>

<script>
let callerData = {number:'', name:'', notes:'', callId:-1, file_no:'', phone2:'', relation:'patient'};

function updateCallerInfo(number, name, notes, callId, extra) {
  extra = extra || {};
  callerData = {number, name: name || 'Unknown', notes: notes || '', callId,
    file_no: extra.file_no || '', phone2: extra.phone2 || '',
    relation: extra.relation || 'patient'};
  document.getElementById('callerName').textContent = callerData.name;
  document.getElementById('callerNumber').textContent = callerData.number || '-';
  document.getElementById('callerNameInput').value = callerData.name !== 'Unknown' ? callerData.name : '';
  document.getElementById('notesInput').value = callerData.notes;
  document.getElementById('callerFileNoInput').value = callerData.file_no;
  document.getElementById('callerPhone2Input').value = callerData.phone2;
  document.getElementById('callerRelationInput').value = callerData.relation;
  document.getElementById('avatar').textContent = (callerData.name || '?').charAt(0).toUpperCase();
  resetHis();

  const btn = document.getElementById('saveBtn');
  if (btn) { btn.textContent = 'Save'; btn.disabled = false; }
  hideToast();

  const badge = document.getElementById('statusBadge');
  if (callerData.name && callerData.name !== 'Unknown' && callerData.name !== 'New Caller') {
    badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-semibold bg-teal-soft text-teal';
    badge.textContent = 'Known';
  } else {
    badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-semibold bg-gold-soft text-warning';
    badge.textContent = 'New';
  }
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.className = 'mx-4 mb-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-center ' +
    (isError ? 'bg-red-50 text-error' : 'bg-teal-soft text-teal');
  t.textContent = msg;
}

function hideToast() {
  const t = document.getElementById('toast');
  t.className = 'hidden mx-4 mb-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-center';
}

function notifySaveResult(ok) {
  const btn = document.getElementById('saveBtn');
  if (ok) {
    showToast('Saved successfully', false);
    if (btn) { btn.textContent = 'Save'; btn.disabled = false; }
    // Auto close after confirmed save
    setTimeout(function() {
      try {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(JSON.stringify({action:'dismiss'}));
        }
      } catch(e) {}
    }, 700);
  } else {
    showToast('Save failed — check connection', true);
    if (btn) { btn.textContent = 'Retry'; btn.disabled = false; }
  }
}

function save() {
  var name = document.getElementById('callerNameInput').value.trim();
  var notes = document.getElementById('notesInput').value.trim();
  var file_no = document.getElementById('callerFileNoInput').value.trim();
  var phone2 = document.getElementById('callerPhone2Input').value.trim();
  var relation = document.getElementById('callerRelationInput').value;
  var btn = document.getElementById('saveBtn');
  btn.textContent = 'Saving...';
  btn.disabled = true;
  hideToast();

  try {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify({action:'save', name:name, notes:notes, file_no:file_no, phone2:phone2, relation:relation}));
    }
  } catch(e) {
    btn.textContent = 'Save';
    btn.disabled = false;
  }
}

function dismiss() {
  try {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify({action:'dismiss'}));
    }
  } catch(e) {}
}

function historyBadgeClass(status) {
  switch (status) {
    case 'answered': return 'bg-green-100 text-green-700';
    case 'missed': return 'bg-red-100 text-red-600';
    case 'outgoing': return 'bg-sky-100 text-sky-700';
    case 'outgoing-no-answer': return 'bg-amber-100 text-amber-700';
    case 'called-back-answered': return 'bg-emerald-100 text-emerald-800 ring-1 ring-emerald-300';
    case 'called-back-no-answer': return 'bg-amber-50 text-amber-800 ring-1 ring-amber-300';
    default: return 'bg-gray-100 text-gray-600';
  }
}

function historyLabel(status) {
  switch (status) {
    case 'answered': return 'Answered';
    case 'missed': return 'Missed';
    case 'outgoing': return 'Outgoing';
    case 'outgoing-no-answer': return 'No answer';
    case 'called-back-answered': return 'Called back';
    case 'called-back-no-answer': return 'No answer';
    default: return status ? String(status).replace(/-/g, ' ') : 'Unknown';
  }
}

function formatHistoryDuration(sec) {
  var s = parseInt(sec, 10);
  if (isNaN(s) || s <= 0) return '';
  var m = Math.floor(s / 60);
  var r = s % 60;
  return m + ':' + (r < 10 ? '0' + r : r);
}

function updateCallerHistory(jsonText) {
  var list = document.getElementById('callerHistory');
  var empty = document.getElementById('historyEmpty');
  var items = [];
  try {
    var data = (typeof jsonText === 'string') ? JSON.parse(jsonText) : jsonText;
    if (Array.isArray(data)) items = data;
    else if (data && Array.isArray(data.history)) items = data.history;
    else items = [];
  } catch (e) { items = []; }
  list.innerHTML = '';
  if (!items.length) {
    if (empty) empty.style.display = '';
    return;
  }
  if (empty) empty.style.display = 'none';
  items.forEach(function (h) {
    h = h || {};
    var row = document.createElement('div');
    row.className = 'flex items-center gap-2 px-2 py-1.5 rounded-lg bg-surface border border-border';
    var time = document.createElement('span');
    time.className = 'text-xs text-ink truncate';
    time.textContent = h.time || '-';
    row.appendChild(time);
    var badge = document.createElement('span');
    badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-semibold shrink-0 ' + historyBadgeClass(h.status);
    badge.textContent = historyLabel(h.status);
    row.appendChild(badge);
    if (h.answered_by) {
      var by = document.createElement('span');
      by.className = 'text-[11px] text-muted truncate';
      by.textContent = 'answered by ' + h.answered_by;
      row.appendChild(by);
    }
    var dur = formatHistoryDuration(h.duration);
    if (dur) {
      var d = document.createElement('span');
      d.className = 'text-[11px] font-mono text-muted ml-auto shrink-0';
      d.textContent = dur;
      row.appendChild(d);
    }
    list.appendChild(row);
  });
}

// ---- Patient File (WebHIS, read-only) ----
// يملؤه C++ عبر ExecuteScript بعد جلب /api/his/caller/<phone>
// ok:false (401/انقطاع/غير مهيأ) وأي خطء شبكة => إخفاء صامت دون إزعاج الموظف

let hisData = null;

function postNative(object) {
  try {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify(object));
    }
  } catch (e) {}
}

function resetHis() {
  hisData = null;
  var section = document.getElementById('hisSection');
  if (section) section.classList.add('hidden');
  var badge = document.getElementById('hisBadge');
  if (badge) badge.classList.add('hidden');
  var summary = document.getElementById('hisSummary');
  if (summary) summary.textContent = '';
  var body = document.getElementById('hisBody');
  if (body) { body.classList.remove('hidden'); body.innerHTML = ''; }
  var ch = document.getElementById('hisChevron');
  if (ch) ch.innerHTML = '&#9662;';
}

function toggleHis() {
  var body = document.getElementById('hisBody');
  var ch = document.getElementById('hisChevron');
  if (!body) return;
  body.classList.toggle('hidden');
  if (ch) ch.innerHTML = body.classList.contains('hidden') ? '&#9662;' : '&#9652;';
}

function hisUnavailable() {
  resetHis();
}

function hisChip(text, cls) {
  var span = document.createElement('span');
  span.className = 'px-2 py-0.5 rounded-full text-[10px] font-semibold shrink-0 ' + cls;
  span.textContent = text;
  return span;
}

function hisLabel(cls, text) {
  var el = document.createElement('div');
  el.className = cls;
  el.textContent = text;
  return el;
}

function hisFallbackForm() {
  var wrap = document.createElement('div');
  wrap.className = 'flex flex-col gap-2';
  wrap.appendChild(hisLabel('text-xs text-ink-sec', 'No hospital record for this number. Search by:'));
  var row = document.createElement('div');
  row.className = 'flex gap-2';
  var by = document.createElement('select');
  by.id = 'hisFallbackBy';
  by.className = 'px-2 py-1.5 border border-border rounded-lg text-sm text-ink bg-white transition';
  var o1 = document.createElement('option'); o1.value = 'name'; o1.textContent = 'Name';
  var o2 = document.createElement('option'); o2.value = 'id'; o2.textContent = 'ID card';
  by.appendChild(o1); by.appendChild(o2);
  var input = document.createElement('input');
  input.id = 'hisFallbackQ';
  input.type = 'text';
  input.placeholder = 'Search term';
  input.className = 'flex-1 min-w-0 px-3 py-1.5 border border-border rounded-lg text-sm text-ink bg-white transition';
  row.appendChild(by); row.appendChild(input);
  wrap.appendChild(row);
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Search patient';
  btn.onclick = hisFallbackSearch;
  btn.className = 'bg-teal hover:bg-teal-dark text-white font-semibold py-1.5 rounded-lg transition text-sm';
  wrap.appendChild(btn);
  return wrap;
}

function hisFallbackSearch() {
  var by = document.getElementById('hisFallbackBy');
  var input = document.getElementById('hisFallbackQ');
  var q = input ? input.value.trim() : '';
  if (!q) { input.focus(); return; }
  var body = document.getElementById('hisBody');
  if (body) { body.innerHTML = ''; body.appendChild(hisLabel('text-xs text-muted text-center py-2', 'Searching...')); }
  postNative({action: 'his_search', by: by ? by.value : 'name', q: q});
}

function hisSelect(patId) {
  var body = document.getElementById('hisBody');
  if (body) { body.innerHTML = ''; body.appendChild(hisLabel('text-xs text-muted text-center py-2', 'Loading record...')); }
  postNative({action: 'his_select', pat_id: patId});
}

function hisVisitsBlock(visits) {
  var wrap = document.createElement('div');
  wrap.className = 'flex flex-col gap-1.5';
  wrap.appendChild(hisLabel('text-[11px] font-semibold text-ink-sec uppercase tracking-wide', 'Visits'));
  var shown = (visits || []).slice(0, 3);
  shown.forEach(function (v) {
    var row = document.createElement('div');
    row.className = 'flex items-center gap-2 px-2 py-1.5 rounded-lg bg-surface border border-border';
    var date = document.createElement('span');
    date.className = 'text-xs text-ink shrink-0';
    date.textContent = (v.date || '-') + ' ' + (v.time || '');
    row.appendChild(date);
    row.appendChild(hisChip(v.type || '-', v.type === 'REG' ? 'bg-teal-soft text-teal' : 'bg-gold-soft text-warning'));
    var cons = document.createElement('span');
    cons.className = 'text-[11px] text-muted truncate flex-1 min-w-0';
    cons.textContent = v.consultant || '';
    row.appendChild(cons);
    var amt = document.createElement('span');
    amt.className = 'text-[11px] font-mono text-ink-sec shrink-0';
    amt.textContent = (v.amount || 0) + ' OMR';
    row.appendChild(amt);
    wrap.appendChild(row);
  });
  if ((visits || []).length > 3) {
    wrap.appendChild(hisLabel('text-[11px] text-muted', '+' + (visits.length - 3) + ' more visits'));
  }
  return wrap;
}

function hisOpenButton() {
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Open File';
  btn.onclick = function () { postNative({action: 'open_webhis'}); };
  btn.className = 'bg-white border border-border hover:bg-surface text-ink-sec font-semibold py-1.5 rounded-lg transition text-sm';
  return btn;
}

// مؤشر انتظار قصير يظهر فور بدء جلب بيانات المشفى، ثم يُستبدل بالبطاقة أو يُخفى بهدوء
function hisLoading() {
  var section = document.getElementById('hisSection');
  var body = document.getElementById('hisBody');
  var badge = document.getElementById('hisBadge');
  var summary = document.getElementById('hisSummary');
  if (!section || !body) return;
  section.classList.remove('hidden');
  if (badge) { badge.classList.add('hidden'); badge.textContent = ''; }
  if (summary) summary.textContent = 'loading...';
  body.innerHTML = '';
  var row = document.createElement('div');
  row.className = 'flex items-center justify-center gap-2 py-3 text-xs text-muted';
  var spin = document.createElement('span');
  spin.className = 'h-3.5 w-3.5 animate-spin rounded-full border-2 border-border border-t-transparent';
  var lbl = document.createElement('span');
  lbl.textContent = 'Loading patient file...';
  row.appendChild(spin);
  row.appendChild(lbl);
  body.appendChild(row);
}

function updateHisInfo(jsonText) {
  var body = document.getElementById('hisBody');
  var section = document.getElementById('hisSection');
  var badge = document.getElementById('hisBadge');
  var summary = document.getElementById('hisSummary');
  if (!body || !section) return;
  var d = null;
  try {
    d = (typeof jsonText === 'string') ? JSON.parse(jsonText) : jsonText;
  } catch (e) { d = null; }
  if (!d) { resetHis(); return; }

  if (d.ok === false) { resetHis(); return; }   // unauthorized / HIS down — silent

  hisData = d;
  section.classList.remove('hidden');
  body.innerHTML = '';

  if (!d.matched || !d.selected) {
    if (badge) { badge.classList.add('hidden'); badge.textContent = ''; }
    if (summary) summary.textContent = 'not found';
    body.appendChild(hisFallbackForm());
    body.appendChild(hisOpenButton());
    return;
  }

  var sel = d.selected;
  var name = sel.name || sel.name_ar || ('MRN ' + sel.mrn);
  if (badge) {
    badge.textContent = 'MRN ' + sel.mrn;
    badge.classList.remove('hidden');
  }
  if (summary) summary.textContent = name;

  // Header: name + age/sex
  var head = document.createElement('div');
  head.className = 'flex items-center gap-2';
  var nm = document.createElement('div');
  nm.className = 'text-sm font-semibold text-ink truncate flex-1 min-w-0';
  nm.textContent = name;
  head.appendChild(nm);
  head.appendChild(hisChip(((sel.age || '') + ' ').trim() + (sel.sex || ''), 'bg-surface text-ink-sec border border-border'));
  body.appendChild(head);

  // Badges: category/insurance, Admitted, Outstanding, Appointment
  var badges = document.createElement('div');
  badges.className = 'flex flex-wrap gap-1.5';
  if (sel.nationality) badges.appendChild(hisChip(sel.nationality, 'bg-surface text-ink-sec border border-border'));
  if (sel.category || sel.insurance_code) badges.appendChild(hisChip((sel.category || sel.insurance_code), 'bg-teal-soft text-teal'));
  if (sel.is_inpatient) badges.appendChild(hisChip('Admitted', 'bg-gold-soft text-warning'));
  var out = parseFloat(sel.outstanding) || 0;
  if (out > 0) badges.appendChild(hisChip('Outstanding: ' + out + ' OMR', 'bg-red-50 text-red-600'));
  if (sel.appointment_date) badges.appendChild(hisChip('Appointment: ' + sel.appointment_date, 'bg-sky-100 text-sky-700'));
  if (badges.children.length) body.appendChild(badges);

  // Doctor line
  var doc = (sel.consultant || '') + (sel.speciality ? (sel.consultant ? ' · ' : '') + sel.speciality : '');
  if (doc) body.appendChild(hisLabel('text-xs text-ink-sec', 'Doctor: ' + doc));
  if (sel.blood_group) body.appendChild(hisLabel('text-xs text-ink-sec', 'Blood group: ' + sel.blood_group));

  body.appendChild(hisVisitsBlock(d.visits));

  // Multiple matches -> selector
  var matches = d.matches || [];
  if (matches.length > 1) {
    var pick = document.createElement('div');
    pick.className = 'flex flex-col gap-1.5';
    pick.appendChild(hisLabel('text-[11px] font-semibold text-ink-sec uppercase tracking-wide',
      'This number maps to ' + matches.length + ' records — pick one:'));
    matches.forEach(function (m) {
      var isActive = String(m.pat_id) === String(sel.mrn);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'flex items-center gap-2 px-2 py-1.5 rounded-lg border transition text-xs text-left ' +
        (isActive ? 'border-teal bg-teal-soft text-ink' : 'border-border bg-white text-ink-sec hover:bg-surface');
      var id = document.createElement('span');
      id.className = 'font-mono shrink-0';
      id.textContent = m.pat_id;
      btn.appendChild(id);
      var label = document.createElement('span');
      label.className = 'truncate flex-1 min-w-0';
      label.textContent = (m.name || '') + ((m.age || '') ? ' · ' + m.age + ' ' + (m.sex || '') : '');
      btn.appendChild(label);
      btn.onclick = function () { if (!isActive) hisSelect(m.pat_id); };
      pick.appendChild(btn);
    });
    body.appendChild(pick);
  }

  // Populate the MRN into the caller's file no. field ONLY when empty
  var f = document.getElementById('callerFileNoInput');
  if (f && !f.value.trim()) f.value = sel.mrn;

  body.appendChild(hisOpenButton());
}

resetHis();
updateCallerInfo('', 'New Caller', '', -1);
</script>

</body>
</html>
